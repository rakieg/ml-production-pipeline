name: Deploy ML Pipeline to Databricks

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
#        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      setup:
        description: "Setup workspace"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
      - feature

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Use GitHub Environments for protection rules and environment-specific secrets
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Deploy to Databricks
        env:
          # Use environment-specific secrets (configured per GitHub Environment)
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_USER_EMAIL: ${{ secrets.DATABRICKS_USER_EMAIL }}
          TARGET_ENV: ${{ github.event.inputs.environment }}
          RUN_SETUP: ${{ github.event.inputs.setup }}
        run: |
          # Validate secrets
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ] || [ -z "DATABRICKS_USER_EMAIL" ]; then
            echo "Error: Databricks credentials not configured for environment: $TARGET_ENV"
            exit 1
          fi

          echo "Deploying to: $TARGET_ENV"

          # Build command
          CMD="python -m src.cli --env $TARGET_ENV"

          if [ "$RUN_SETUP" = "true" ]; then
            echo "Including workspace setup"
            CMD="$CMD --setup"
          fi

          # Execute deployment
          $CMD

          echo "Deployment completed successfully"

      - name: Deployment summary
        if: success()
        run: |
          echo "Successfully deployed to: ${{ github.event.inputs.environment || 'prod' }}"
